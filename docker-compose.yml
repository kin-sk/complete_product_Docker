version: "3.8"

services:
  # フロントエンド (Vite + React + TypeScript)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # node_modulesはコンテナ内に保持
    environment:
      - VITE_API_URL=http://localhost:8080/api
    depends_on:
      - backend
    restart: "no"

  # バックエンド (Spring Boot + Java)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2 # Mavenキャッシュを永続化
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/todo_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      # JVMメモリ制限（重要！）
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m
    depends_on:
      - db
    command: sleep infinity
    restart: "no"

  # データベース (PostgreSQL)
  db:
    image: postgres:16-alpine # alpine版で軽量化
    container_name: todo-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=todo_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    # PostgreSQLのメモリ制限
    shm_size: 128mb

  # Nginx (リバースプロキシ) - 開発時は起動しない
  # 本番環境確認時のみ使用
  nginx:
    image: nginx:alpine
    container_name: todo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro # ビルド後の静的ファイル
    depends_on:
      - frontend
      - backend
    restart: "no"
    profiles:
      - production # 開発時は起動しない

# ボリューム定義
volumes:
  db-data: # データベースデータの永続化
  maven-cache: # Mavenキャッシュの永続化（ビルド高速化）
